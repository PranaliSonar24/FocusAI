version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg14-latest
    container_name: focusai-timescaledb
    environment:
      POSTGRES_USER: focus_user
      POSTGRES_PASSWORD: focus_password
      POSTGRES_DB: focus_db
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/home/postgres/pgdata/data
    restart: always

volumes:
  timescaledb_data:
